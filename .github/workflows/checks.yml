name: Reproducibility checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-summary.txt
      - name: Install validated direct dependencies
        run: python -m pip install -r requirements-summary.txt
      - name: Compile modules
        run: python -m compileall -q src scripts
      - name: Check cohort, split, preprocessing, and download rules
        run: python -m unittest discover -s tests -v
      - name: Execute source-backed results review
        run: python scripts/run_notebook.py notebooks/04_analysis_findings.ipynb --in-process
